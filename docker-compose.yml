version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: voicekhata-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voicekhata
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from this machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: voicekhata-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
